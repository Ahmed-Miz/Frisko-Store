<div id="default-carousel" class="relative w-full" data-carousel="slide">
  <!-- Carousel wrapper -->
  @if (heroSlids().length > 0) {
    <div class="relative h-56 overflow-hidden rounded-base md:h-96">
      @for (slid of heroSlids(); track slid.id; let i = $index) {
        <!-- أول صورة تظهر افتراضياً والباقي مخفي عشان ما يعلقوش -->
        <div class="duration-700 ease-in-out" [class.hidden]="i !== 0" data-carousel-item>
          <img
            [src]="slid.image_url"
            class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2 object-cover h-full"
            [alt]="slid.title"
          />
        </div>
      }
    </div>

    <!-- Slider indicators الديناميكية عشان متتعلقش -->
    <div
      class="absolute z-30 flex -translate-x-1/2 bottom-5 left-1/2 space-x-3 rtl:space-x-reverse"
    >
      @for (slid of heroSlids(); track slid.id; let i = $index) {
        <button
          type="button"
          class="w-3 h-3 rounded-full"
          [attr.aria-current]="i === 0 ? 'true' : 'false'"
          [attr.aria-label]="'Slide ' + (i + 1)"
          [attr.data-carousel-slide-to]="i"
        ></button>
      }
    </div>
  }

  <!-- Slider controls (Previous / Next) زي ما هي -->
  <button
    type="button"
    class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
    data-carousel-prev
  >
    <span
      class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50"
    >
      <svg
        class="w-5 h-5 text-white rtl:rotate-180"
        aria-hidden="true"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="m15 19-7-7 7-7"
        />
      </svg>
    </span>
  </button>
  <button
    type="button"
    class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none"
    data-carousel-next
  >
    <span
      class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 group-hover:bg-white/50"
    >
      <svg
        class="w-5 h-5 text-white rtl:rotate-180"
        aria-hidden="true"
        fill="none"
        viewBox="0 0 24 24"
      >
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="m9 5 7 7-7 7"
        />
      </svg>
    </span>
  </button>
</div>
