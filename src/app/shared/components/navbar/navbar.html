<!-- 1.(Top Bar) -->
<div
  class="hidden md:block bg-gray-100 text-gray-600 text-xs py-1 md:py-2 px-4 border-b border-gray-200"
>
  <div class="max-w-screen-xl mx-auto flex flex-wrap justify-between items-center">
    <!-- اليسار: مميزات المتجر -->
    <div class="flex items-center space-x-6 rtl:space-x-reverse">
      <span class="flex items-center">
        <i class="fa-solid fa-truck-fast text-green-600 mr-2"></i> Free Shipping on Orders 500 EGP
      </span>
      <span class="flex items-center">
        <i class="fa-solid fa-gift text-green-600 mr-2"></i> New Arrivals Daily
      </span>
    </div>

    <!-- Auth -->
    <div class="md:flex md:items-center md:space-x-4 rtl:space-x-reverse">
      <div class="flex justify-between items-center space-x-3 rtl:space-x-reverse">
        <a href="tel:+18001234567" class="hover:text-green-600 flex items-center">
          <i class="fa-solid fa-phone mr-1"></i> +1 (800) 123-4567
        </a>
        <span class="text-gray-300">|</span>
        <a href="mailto:support@freshcart.com" class="hover:text-green-600 flex items-center">
          <i class="fa-regular fa-envelope mr-1"></i> support&#64;freshcart.com
        </a>
      </div>
    </div>
  </div>
</div>

<!-- Navbar الرئيسية -->
<nav class="bg-white border-b border-gray-200 py-3 px-4 sticky top-0 z-50 shadow-sm">
  <div class="max-w-screen-xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
    <!-- الصف العلوي في الموبايل (الشعار + أيقونة السلة + زر القائمة) -->
    <div class="w-full flex items-center justify-between md:w-auto">
      <!-- (Logo) -->
      <a routerLink="/shop" class="flex items-center space-x-2 rtl:space-x-reverse">
        <img
          src="/WhatsApp Image 2026-09-25 at 1.36.47 PM.jpeg"
          class="w-10 md:w-12 rounded-2xl"
          alt="Frisko"
        />
        <span class="text-xl md:text-2xl font-bold text-gray-800 tracking-tight">Frisko</span>
      </a>

      <!-- أزرار الموبايل (السلة + زر القائمة) بجانب بعض -->
      <div class="flex items-center space-x-2 rtl:space-x-reverse md:hidden">
        <!-- أيقونة السلة للموبايل -->
        <a routerLink="/cart" class="text-gray-700 hover:text-green-600 text-lg relative p-2">
          <i class="fa-solid fa-cart-shopping"></i>
          <span
            class="absolute top-0 right-0 bg-green-600 text-white text-[9px] font-bold rounded-full h-4 w-4 flex items-center justify-center"
          >
            {{ cartCount }}
          </span>
        </a>

        <!-- زرار التوجيل (القائمة المنسدلة) -->
        <button
          data-collapse-toggle="navbar-search"
          type="button"
          class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-700 rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200"
          aria-controls="navbar-search"
          aria-expanded="false"
        >
          <span class="sr-only">Open main menu</span>
          <svg
            class="w-6 h-6"
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke="currentColor"
              stroke-linecap="round"
              stroke-width="2"
              d="M5 7h14M5 12h14M5 17h14"
            />
          </svg>
        </button>
      </div>
    </div>

    <!-- input البحث للموبايل (ظاهر دائماً وتحت الشعار مباشرة في الشاشات الصغيرة) -->
    <div class="w-full md:hidden relative">
      <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
        <svg
          class="w-4 h-4 text-gray-400"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke="currentColor"
            stroke-linecap="round"
            stroke-width="2"
            d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z"
          />
        </svg>
      </div>
      <input
        type="text"
        #mobileInput
        (input)="onSearch(mobileInput.value)"
        (keyup.enter)="onSearch(mobileInput.value)"
        placeholder="Search for products..."
        class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full pl-9 pr-12 py-2.5 outline-none focus:border-green-500"
      />
      <button
        type="button"
        (click)="onSearch(mobileInput.value)"
        class="absolute right-1 top-1/2 -translate-y-1/2 bg-green-600 hover:bg-green-700 text-white w-8 h-8 rounded-full flex items-center justify-center transition"
      >
        <i class="fa-solid fa-magnifying-glass text-xs"></i>
      </button>
    </div>

    <!-- الروابط والقائمة (تظهر وتختفي في الموبايل بناءً على زر التوجيل) -->
    <div
      class="items-center justify-between hidden w-full md:flex md:w-auto md:order-1"
      id="navbar-search"
    >
      <ul
        class="font-medium flex flex-col p-4 md:p-0 mt-4 md:mt-0 border border-gray-100 rounded-lg bg-gray-50 md:bg-white md:flex-row md:items-center md:space-x-6 rtl:space-x-reverse md:border-0"
      >
        <li>
          <a
            routerLink="/home"
            routerLinkActive="text-green-600 font-bold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="block py-2 md:py-0 hover:text-green-600 transition"
            >Home</a
          >
        </li>
        <li>
          <a
            routerLink="/shop"
            routerLinkActive="text-green-600 font-bold"
            [routerLinkActiveOptions]="{ exact: true }"
            class="block py-2 md:py-0 hover:text-green-600 transition"
            >Shop</a
          >
        </li>
        @for (link of navLinks; track link.name) {
          <li>
            <a
              [routerLink]="['/shop']"
              [queryParams]="link.query"
              routerLinkActive="text-green-600 font-bold"
              class="block py-2 md:py-0 hover:text-green-600 transition"
            >
              {{ link.name }}
            </a>
          </li>
        }

        <!-- الأيقونات وأزرار الدخول في الـ Sidebar / Desktop -->
        <div
          class="flex flex-col md:flex-row items-start md:items-center space-y-3 md:space-y-0 md:space-x-4 rtl:space-x-reverse mt-3 md:mt-0 pt-3 md:pt-0 border-t md:border-t-0 border-gray-200"
        >
          <!-- المفضلة (Wishlist) -->
          <a
            routerLink="/wishlist"
            class="text-gray-700 hover:text-green-600 text-lg flex items-center gap-2 md:text-xl"
          >
            <i class="fa-regular fa-heart"></i>
            <span class="md:hidden text-sm">Wishlist</span>
          </a>

          <!-- السلة للديسكتوب فقط (لأنها فوق في الموبايل) -->
          <a
            routerLink="/cart"
            class="hidden md:flex text-gray-700 hover:text-green-600 text-xl relative p-1"
          >
            <i class="fa-solid fa-cart-shopping"></i>
            <span
              class="absolute -top-1 -right-1 bg-green-600 text-white text-[10px] font-bold rounded-full h-4 w-4 flex items-center justify-center"
            >
              {{ cartCount }}
            </span>
          </a>

          <!-- زر تسجيل الدخول / الخروج -->
          @if (logged()) {
            <button
              (click)="logout()"
              class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-medium text-sm px-4 py-2 rounded-full flex items-center justify-center space-x-2 rtl:space-x-reverse transition"
            >
              <i class="fa-solid fa-right-from-bracket mr-1"></i>
              <span>Sign Out</span>
            </button>
          } @else {
            <a
              routerLink="/auth/login"
              class="w-full md:w-auto bg-green-600 hover:bg-green-700 text-white font-medium text-sm px-4 py-2 rounded-full flex items-center justify-center space-x-2 rtl:space-x-reverse transition"
            >
              <i class="fa-regular fa-user"></i>
              <span>Sign In</span>
            </a>
          }
        </div>
      </ul>
    </div>

    <!-- input البحث للديسكتوب -->
    <div class="hidden md:block flex-1 max-w-md mx-4">
      <div class="relative">
        <input
          type="text"
          #desktopInput
          (input)="onSearch(desktopInput.value)"
          (click)="$event.stopPropagation()"
          placeholder="Search for products more..."
          class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-full pl-4 pr-12 py-2.5 focus:ring-green-500 focus:border-green-500 outline-none transition"
        />
        <button
          type="button"
          (click)="onSearch(desktopInput.value)"
          class="absolute right-1 top-1/2 -translate-y-1/2 bg-green-600 hover:bg-green-700 text-white w-8 h-8 rounded-full flex items-center justify-center transition"
        >
          <i class="fa-solid fa-magnifying-glass text-xs"></i>
        </button>
      </div>
    </div>
  </div>
</nav>
