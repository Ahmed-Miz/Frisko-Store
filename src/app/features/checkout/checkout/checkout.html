<div class="min-h-screen bg-gray-50 py-10 px-4 sm:px-6 lg:px-8" dir="rtl">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-extrabold text-gray-900">Complete Order (Checkout)</h1>
      <p class="mt-2 text-sm text-gray-600">
        رقم السلة / الطلب: <span class="font-bold text-indigo-600"> cartId || 'غير متوفر' </span>
      </p>
    </div>
    <!-- Form Group -->
    <form
      [formGroup]="checkOut"
      (ngSubmit)="submitOrder()"
      class="grid grid-cols-1 md:grid-cols-3 gap-8"
    >
      <!--(2 columns) -->
      <div class="md:col-span-2 bg-white shadow-md rounded-xl p-6 space-y-4">
        <h2 class="text-xl font-bold text-gray-800 mb-6 border-b pb-3">
          Shipping and Delivery Information
        </h2>

        <!-- name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
          <input
            type="text"
            formControlName="customer_name"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <!-- Emali -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input
              type="email"
              formControlName="customer_email"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            />
          </div>
          <!-- Phone Number -->
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Phone Number </label>
            <input
              type="tel"
              formControlName="customer_phone"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            />
          </div>
        </div>

        <!-- Address -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Shipping Address</label>
          <input
            type="text"
            formControlName="shipping_address"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <!-- City -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">City</label>
          <input
            type="text"
            formControlName="city"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <!-- Payment Method -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Payment Method</label>
          <select
            formControlName="payment_method"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          >
            <option value="cod">
              <i class="fa-solid fa-wallet text-green-300"></i> Cash on Delivery
            </option>
            <option value="card">Credit Card</option>
          </select>
        </div>

        <!-- button submit -->
        <button
          type="submit"
          class="w-full mt-6 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 shadow-lg"
        >
          Finalize the order
        </button>
      </div>

      <!-- Order Summary -->
      <div class="bg-white shadow-md rounded-xl p-6 h-fit">
        <h2 class="text-xl font-bold text-gray-800 mb-4 border-b pb-3">Order Summary</h2>

        <div class="border-t pt-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Coupon Code</label>
          <input
            type="text"
            formControlName="coupon_code"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm uppercase focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>
      </div>
    </form>
  </div>
</div>
