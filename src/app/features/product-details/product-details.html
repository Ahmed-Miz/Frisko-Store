<!-- 3. قسم شبكة المنتجات (Product Grid ) -->
<div class="max-w-screen-xl mx-auto px-4 sm:px-6 mt-10">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl sm:text-2xl font-bold text-gray-800 border-l-4 border-green-600 pl-3">
      Trending Products
    </h2>
  </div>

  <!-- شبكة المنتجات: عمودين في الموبايل، 3 في التابلت، و 4 في الديسكتوب -->
  <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6">
    @for (product of productList(); track product.id) {
      <div
        class="bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm hover:shadow-md transition group flex flex-col justify-between"
      >
        <!-- صورة المنتج مع زر المفضلة -->
        <div class="relative bg-gray-100 w-full h-48 sm:h-64 overflow-hidden">
          <img
            [src]="product.primary_image"
            [alt]="product.title"
            class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
          />
          @if (isNewProduct(product.created_at)) {
            <span
              class="absolute top-2 left-2 bg-green-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow"
            >
              {{ product.badge_label }}
            </span>
          }
          <button
            class="absolute top-2 right-2 w-7 h-7 sm:w-8 sm:h-8 bg-white/80 rounded-full flex items-center justify-center text-gray-700 hover:text-red-500 transition shadow"
          >
            <i class="fa-regular fa-heart text-xs sm:text-sm"></i>
          </button>
        </div>

        <!-- تفاصيل المنتج -->
        <div class="p-3 sm:p-4 flex flex-col flex-grow justify-between">
          <div>
            <span class="text-[11px] sm:text-xs text-gray-400 block mb-1 truncate">{{
              product.title
            }}</span>
            <h3 class="text-xs sm:text-sm font-medium text-gray-800 line-clamp-2">
              {{ product.description }}
            </h3>
          </div>

          <div class="flex items-center justify-between mt-3 pt-2 border-t border-gray-50">
            <div>
              <span class="text-green-600 font-bold text-sm sm:text-base block">
                <span class="text-[10px]">TRY</span> {{ product.price }}
              </span>
              @if (product.old_price) {
                <span class="text-gray-400 text-[11px] sm:text-xs line-through">
                  <span class="text-[9px]">TRY</span> {{ product.old_price }}
                </span>
              }
            </div>
            <button
              (click)="addToCart(product.id, product.reviews_count)"
              class="w-8 h-8 sm:w-9 sm:h-9 bg-gray-900 hover:bg-green-600 text-white rounded-full flex items-center justify-center transition shadow-sm shrink-0"
            >
              <i class="fa-solid fa-plus text-xs"></i>
            </button>
          </div>
        </div>
      </div>
    }
  </div>
</div>
